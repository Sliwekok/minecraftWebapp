monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        channels: ["event", "doctrine", "console", 'server', 'config', 'command', 'critical', 'backup']
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                level: info
                channels: ["!event", "!doctrine", "!console", '!server', '!config', '!command', '!critical']
            server:
                type: stream
                path: "%kernel.logs_dir%/server.log"
                level: info
                channels: ['server']
            config:
                type: stream
                path: "%kernel.logs_dir%/config.log"
                level: info
                channels: ['config']
            command:
                type: stream
                path: "%kernel.logs_dir%/command.log"
                level: info
                channels: ['command']
            critical:
                type: stream
                path: "%kernel.logs_dir%/critical.log"
                level: info
                channels: ['critical']
            backup:
                type: stream
                path: "%kernel.logs_dir%/backup.log"
                level: info
                channels: ['backup']

